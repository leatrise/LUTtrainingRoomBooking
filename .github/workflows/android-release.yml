name: Android Release Build
permissions:
  contents: read
  actions: read

on:
  push:
    branches: [ main, master, build ]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.detect_version.outputs.version_name }}
      version_code: ${{ steps.detect_version.outputs.version_code }}
      artifact_basename: ${{ steps.detect_version.outputs.artifact_basename }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare release p12 keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "Missing KEYSTORE_BASE64 secret"
          exit 1
        fi
        KEYSTORE_PATH="app/release.p12"
        echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        chmod 600 "$KEYSTORE_PATH"

    - name: Detect version
      id: detect_version
      run: |
        SHORT_SHA=$(git rev-parse --short=8 HEAD)
        VERSION_NAME="${SHORT_SHA}"
        VERSION_CODE=$(git show -s --format=%ct HEAD)
        APP_NAME=$(grep -m1 'name="app_name"' app/src/main/res/values/strings.xml | sed -E 's/.*>([^<]+)<.*/\1/' | tr ' ' '_')
        ARTIFACT_BASE="${APP_NAME}-${VERSION_NAME}"
        echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
        echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
        echo "artifact_basename=${ARTIFACT_BASE}" >> $GITHUB_OUTPUT

    - name: Build release APK
      env:
        ANDROID_KEYSTORE_PATH: app/release.p12
        ANDROID_KEYSTORE_TYPE: PKCS12
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        VERSION_CODE: ${{ steps.detect_version.outputs.version_code }}
        VERSION_NAME: ${{ steps.detect_version.outputs.version_name }}
      run: ./gradlew assembleRelease

    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ${{ steps.detect_version.outputs.artifact_basename }}-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Upload R8 mapping (release)
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ${{ steps.detect_version.outputs.artifact_basename }}-mapping
        path: app/build/outputs/mapping/release/*
        retention-days: 30

    - name: Upload build reports (release)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports-release
        path: |
          app/build/reports/
          build/reports/
        retention-days: 7

  notify:
    runs-on: ubuntu-latest
    needs: release
    if: always() && github.event_name == 'push'

    steps:
    - name: Download release APK artifact
      if: needs.release.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.release.outputs.artifact_basename }}-release
        path: artifacts/apk

    - name: Send Telegram message and release APK
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ARTIFACT_BASENAME: ${{ needs.release.outputs.artifact_basename }}
        VERSION_NAME: ${{ needs.release.outputs.version_name }}
        VERSION_CODE: ${{ needs.release.outputs.version_code }}
        STATUS: ${{ needs.release.result }}
        COMMIT_MESSAGE: |+
          New release build pushed\!
          Version: `${{ needs.release.outputs.version_name }}`
          Version code: `${{ needs.release.outputs.version_code }}`
          ```
          ${{ github.event.head_commit.message }}
          ```by `${{ github.event.head_commit.author.name }}`
          See commit detail [here](${{ github.event.head_commit.url }})
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "Telegram notification skipped: missing TELEGRAM_BOT_TOKEN or TELEGRAM_RELEASE_CHAT_ID."
          exit 0
        fi

        if [ "$STATUS" = "success" ]; then
          APK_PATH=$(ls artifacts/apk/*.apk 2>/dev/null | head -n 1)
          TARGET_FILENAME="${ARTIFACT_BASENAME}-release.apk"
          if [ -n "$APK_PATH" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${APK_PATH};filename=${TARGET_FILENAME}" \
              -F "parse_mode=MarkdownV2" \
              --form-string "caption=${COMMIT_MESSAGE}" \
              -F "disable_web_page_preview=true"
          else
            echo "No release APK artifact found after download."
          fi
        fi
